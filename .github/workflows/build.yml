name: Build Debug APK

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

env:
  COMPILE_SDK: 36
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      apk-path: ${{ steps.apk-info.outputs.apk-path }}

    steps:
      - name: 审计
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "### ⚡ 手动触发" >> $GITHUB_STEP_SUMMARY
          echo "- **调用者**: \`${{ github.actor }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **构建**: ${{ inputs.build_type || 'debug' }}" >> $GITHUB_STEP_SUMMARY

      - uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/*.gradle', '**/gradle-wrapper.properties', 'gradle.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 确认 SDK 状态
        run: |
          echo "Android home: $ANDROID_HOME"
          ls -la $ANDROID_HOME/platforms/ 2>/dev/null || echo "No platforms dir"
          ls -la $ANDROID_HOME/build-tools/ 2>/dev/null || echo "No build-tools dir"

      - name: 安装 SDK ${{ env.COMPILE_SDK }}
        run: |
          # 尝试安装 target SDK，失败后列出可用 SDK 但不退出
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-${{ env.COMPILE_SDK }}" 2>&1 || true
          # 确认安装结果
          ls $ANDROID_HOME/platforms/android-${{ env.COMPILE_SDK }} 2>/dev/null && \
            echo "✅ SDK ${{ env.COMPILE_SDK }} 已安装" || \
            echo "⚠️ SDK ${{ env.COMPILE_SDK }} 未安装，尝试备用方案"

      - name: 配置 local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: 授权 gradlew
        run: chmod +x gradlew

      - name: 设置构建类型
        id: build-type
        run: |
          BT="${{ inputs.build_type || 'debug' }}"
          echo "build-type=$BT" >> $GITHUB_OUTPUT
          echo "构建类型: $BT" >> $GITHUB_STEP_SUMMARY

      - name: 构建 APK
        run: ./gradlew assemble${{ steps.build-type.outputs.build-type }}
        env:
          KEYSTORE_DEBUG_PASSWORD: ${{ secrets.KEYSTORE_DEBUG_PASSWORD || 'android' }}

      - name: APK 信息
        id: apk-info
        run: |
          BT="${{ steps.build-type.outputs.build-type }}"
          APK=$(find "app/build/outputs/apk/${BT}" -name '*.apk' | head -1)
          if [ -n "$APK" ]; then
            SIZE=$(ls -lh "$APK" | awk '{print $5}')
            HASH=$(sha256sum "$APK" | awk '{print $1}')
            echo "apk-path=$APK" >> $GITHUB_OUTPUT
            {
              echo "### 📦 $BT APK"
              echo "| 项 | 值 |"
              echo "|---|---|"
              echo "| **路径** | \`$APK\` |"
              echo "| **大小** | $SIZE |"
              echo "| **SHA256** | \`$HASH\` |"
            } >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ APK 未生成" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: SwipeGuard-${{ steps.build-type.outputs.build-type }}-${{ github.sha }}
          path: app/build/outputs/apk/${{ steps.build-type.outputs.build-type }}/
          if-no-files-found: error
          retention-days: 90
