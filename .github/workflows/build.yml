# Build Debug APK — SwipeGuard
#
# 每次 push/PR 到 main 分支时自动构建 Debug APK，
# 并执行代码质量检查（lint）。
# 也可通过 workflow_dispatch 手动触发。

name: Build Debug APK

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'progress.md'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# 同一个分支/PR 的新 commit 会自动取消正在运行的旧 workflow
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_HOME: ${{ github.workspace }}/android-sdk
  # libxposed:service:102.0.0 要求 compileSdk >= 37。
  # compileSdkMinor=0 → AGP 用 platforms/android-37.0。直接下载 zip 解压，
  # 避免 sdkmanager 包名（裸 android-37 / CinnamonBun 均不可用）与许可证交互问题。
  SDK_PLATFORM_ZIP: "https://dl.google.com/android/repository/platform-37.0_r02.zip"
  # AGP 8.13 默认 build-tools 35.0.0；另装 36/37 供匹配。
  BUILD_TOOLS_35: "https://dl.google.com/android/repository/build-tools_r35_linux.zip"
  BUILD_TOOLS_36: "https://dl.google.com/android/repository/build-tools_r36_linux.zip"
  BUILD_TOOLS_37: "https://dl.google.com/android/repository/build-tools_r37_linux.zip"

jobs:
  validate:
    name: Validate Gradle Wrapper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

  lint:
    name: Lint Check
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK 37.0
        run: |
          mkdir -p "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" "$ANDROID_HOME/licenses"
          # 预写 license 哈希（zip 解压不含 license 文件，AGP 会拒绝）
          printf '24333f8a63b6825ea9c5514f83c2829b004d1fee\n' > "$ANDROID_HOME/licenses/android-sdk-license"
          printf '84831b9409646a918e30573bab4c9c91346d8abd\n' > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          curl -sSLO "$SDK_PLATFORM_ZIP"
          unzip -qq platform-37.0_r02.zip -d "$ANDROID_HOME/platforms"
          curl -sSLO "$BUILD_TOOLS_35"
          unzip -qq build-tools_r35_linux.zip -d "$ANDROID_HOME/build-tools/35.0.0"
          curl -sSLO "$BUILD_TOOLS_36"
          unzip -qq build-tools_r36_linux.zip -d "$ANDROID_HOME/build-tools/36.0.0"
          curl -sSLO "$BUILD_TOOLS_37"
          unzip -qq build-tools_r37_linux.zip -d "$ANDROID_HOME/build-tools/37.0.0"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Run lint
        id: lint-step
        run: ./gradlew lint --no-daemon
        continue-on-error: true
        env:
          KEYSTORE_DEBUG_PASSWORD: android

      - name: Upload lint results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: |
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml
          if-no-files-found: ignore

      - name: Fail on lint errors
        if: steps.lint-step.outcome != 'success'
        run: |
          echo "❌ Lint check failed — check lint-results artifact for details"
          exit 1

  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    needs: [validate, lint]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK 37.0
        run: |
          mkdir -p "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" "$ANDROID_HOME/licenses"
          # 预写 license 哈希（zip 解压不含 license 文件，AGP 会拒绝）
          printf '24333f8a63b6825ea9c5514f83c2829b004d1fee\n' > "$ANDROID_HOME/licenses/android-sdk-license"
          printf '84831b9409646a918e30573bab4c9c91346d8abd\n' > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          curl -sSLO "$SDK_PLATFORM_ZIP"
          unzip -qq platform-37.0_r02.zip -d "$ANDROID_HOME/platforms"
          curl -sSLO "$BUILD_TOOLS_35"
          unzip -qq build-tools_r35_linux.zip -d "$ANDROID_HOME/build-tools/35.0.0"
          curl -sSLO "$BUILD_TOOLS_36"
          unzip -qq build-tools_r36_linux.zip -d "$ANDROID_HOME/build-tools/36.0.0"
          curl -sSLO "$BUILD_TOOLS_37"
          unzip -qq build-tools_r37_linux.zip -d "$ANDROID_HOME/build-tools/37.0.0"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build Debug APK
        id: build-step
        continue-on-error: true
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon > build_output.txt 2>&1
          echo "exit_code=$?" >> $GITHUB_OUTPUT
        env:
          KEYSTORE_DEBUG_PASSWORD: android

      - name: Show build output (last 100 lines)
        if: always()
        run: |
          if [ -f build_output.txt ]; then
            LINES=$(wc -l < build_output.txt)
            {
              echo "## Build Output (last 100 of $LINES lines)"
              echo '```'
              tail -100 build_output.txt
              echo '```'
            } >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_output.txt
          if-no-files-found: ignore
          retention-days: 30

      - name: Exit with build result
        if: steps.build-step.outputs.exit_code != '0'
        run: |
          echo "❌ Build failed with exit code ${{ steps.build-step.outputs.exit_code }}"
          echo "   See build-log artifact for full details"
          exit ${{ steps.build-step.outputs.exit_code }}

      - name: Upload Debug APK
        if: steps.build-step.outputs.exit_code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: SwipeGuard-debug
          path: app/build/outputs/apk/debug/
          if-no-files-found: error
          retention-days: 90
