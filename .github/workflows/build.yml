name: Build Debug APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: 安装 SDK
        run: |
          # 使用 android-actions/setup-android@v3 的内部脚本
          # 手动安装 cmdline-tools 并接受许可
          mkdir -p $HOME/android/cmdline-tools
          cd /tmp
          curl -fsSL -o tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -qq tools.zip -d $HOME/android/cmdline-tools/
          mv $HOME/android/cmdline-tools/cmdline-tools $HOME/android/cmdline-tools/latest
          mkdir -p $HOME/android/cmdline-tools/latest/bin
          export ANDROID_HOME=$HOME/android
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          yes | sdkmanager --sdk_root=$ANDROID_HOME --licenses 2>&1 || true
          sdkmanager --sdk_root=$ANDROID_HOME "platforms;android-36" "platform-tools" 2>&1 || true
          echo "SDK 状态:"
          ls -la $ANDROID_HOME/platforms/
          echo "---"

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug 2>&1
        env:
          KEYSTORE_DEBUG_PASSWORD: android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SwipeGuard-debug
          path: app/build/outputs/apk/debug/
          if-no-files-found: error
          retention-days: 90
