name: Build Debug APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install SDK and accept all licenses
        run: |
          # Use sdkmanager with proper license acceptance
          export ANDROID_HOME=$HOME/android
          mkdir -p $ANDROID_HOME
          cd /tmp
          curl -sSLO https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -qq commandlinetools-linux-11076708_latest.zip
          mkdir -p $ANDROID_HOME/cmdline-tools
          mv cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          
          # Accept ALL licenses by piping yes 100 times
          for i in $(seq 1 100); do echo "y"; done | \
            sdkmanager --sdk_root=$ANDROID_HOME --licenses 2>&1
          
          # Install SDK 36 + platform-tools
          echo "y" | sdkmanager --sdk_root=$ANDROID_HOME "platforms;android-36" 2>&1
          echo "y" | sdkmanager --sdk_root=$ANDROID_HOME "platform-tools" 2>&1
          
          # Verify
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "sdk.dir=$ANDROID_HOME" > $GITHUB_WORKSPACE/local.properties
          echo "Installed platforms:" && ls -d $ANDROID_HOME/platforms/*/

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew assembleDebug
        env:
          KEYSTORE_DEBUG_PASSWORD: android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SwipeGuard-debug
          path: app/build/outputs/apk/debug/
          if-no-files-found: error
          retention-days: 90
