name: Build Debug APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Fresh install Android SDK + licenses + platforms
        run: |
          # Download cmdline-tools
          mkdir -p $HOME/android
          export ANDROID_HOME=$HOME/android
          cd /tmp
          curl -fsSL -o cmdline.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -qq cmdline.zip -d $ANDROID_HOME/
          mv $ANDROID_HOME/cmdline-tools $ANDROID_HOME/latest
          mkdir -p $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/latest $ANDROID_HOME/cmdline-tools/
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          
          # Accept ALL licenses
          yes | sdkmanager --sdk_root=$ANDROID_HOME --licenses 2>&1
          
          # Install platforms + build-tools
          yes | sdkmanager --sdk_root=$ANDROID_HOME "platforms;android-36" "platform-tools" 2>&1
          
          # Verify
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "SDK installed at $ANDROID_HOME"
          ls -la $ANDROID_HOME/platforms/

      - name: Configure local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
        env:
          KEYSTORE_DEBUG_PASSWORD: ${{ secrets.KEYSTORE_DEBUG_PASSWORD || 'android' }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SwipeGuard-debug
          path: app/build/outputs/apk/debug/
          if-no-files-found: error
          retention-days: 90
