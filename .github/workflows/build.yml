name: Build Debug APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Set up Android SDK (with licenses)
        uses: android-actions/setup-android@v3

      - name: Create license files and install platforms
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          # Create license directory
          mkdir -p "$ANDROID_HOME/licenses"
          # Write SDK licenses (well-known hashes)
          cat > "$ANDROID_HOME/licenses/android-sdk-license" << 'EOF'
          8933bad161af4178b1185d1a37fbf41ea5269c55
          d56f5187479451eabf01fb78af6dfcb131a6481e
          24333f8a63b6825ea9c5514f83c2829b004d1fee
          EOF
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          echo "yes" > "$ANDROID_HOME/licenses/android-googletv-license"
          echo "Licenses created"
          # Now install platforms with auto-confirmation
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" 2>&1
          echo "Installed platforms:"
          ls -d "$ANDROID_HOME/platforms/"*/ 2>&1

      - name: Configure local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
        env:
          KEYSTORE_DEBUG_PASSWORD: ${{ secrets.KEYSTORE_DEBUG_PASSWORD || 'android' }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SwipeGuard-debug
          path: app/build/outputs/apk/debug/
          if-no-files-found: error
          retention-days: 90
