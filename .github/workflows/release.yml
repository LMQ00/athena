# Release APK — SwipeGuard
#
# 当推送 tag (v*) 时自动构建签名 Release APK 并创建 GitHub Release。
# 使用前需要先设置以下 GitHub Secrets：
#
# | Secret                     | 说明                        |
# |----------------------------|-----------------------------|
# | RELEASE_KEYSTORE_BASE64    | Release keystore 的 base64 编码 |
# | RELEASE_KEY_ALIAS         | key 别名                     |
# | RELEASE_KEY_PASSWORD       | key/keystore 密码            |
# | RELEASE_STORE_PASSWORD     | keystore 密码（通常同 key）   |

name: Release APK

on:
  push:
    tags:
      - 'v*'    # 匹配 v1.0.0, v1.1.0, v2.0.0-beta 等
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name for this release'
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false  # Release 不应被取消

env:
  ANDROID_HOME: ${{ github.workspace }}/android-sdk
  SDK_PLATFORM: "platforms;android-36"

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets availability
        run: |
          if [ -z "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ] || \
             [ -z "${{ secrets.RELEASE_KEY_ALIAS }}" ] || \
             [ -z "${{ secrets.RELEASE_KEY_PASSWORD }}" ] || \
             [ -z "${{ secrets.RELEASE_STORE_PASSWORD }}" ]; then
            echo "::warning::One or more release secrets are not configured."
            echo "::warning::Set RELEASE_KEYSTORE_BASE64, RELEASE_KEY_ALIAS,"
            echo "::warning::RELEASE_KEY_PASSWORD, and RELEASE_STORE_PASSWORD in repo secrets."
            echo ""
            echo "To generate a release keystore:"
            echo "  keytool -genkey -v -keystore release.keystore -alias mykey \\"
            echo "    -keyalg RSA -keysize 2048 -validity 10000"
            echo "  base64 release.keystore  # paste as RELEASE_KEYSTORE_BASE64"
          fi

      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK ${{ env.SDK_PLATFORM }}
        run: |
          mkdir -p "$ANDROID_HOME"
          cd /tmp
          curl -sSLO https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -qq commandlinetools-linux-11076708_latest.zip
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          mv cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"

          yes 2>/dev/null | sdkmanager --sdk_root="$ANDROID_HOME" --licenses > /dev/null 2>&1 || true
          echo "y" | sdkmanager --sdk_root="$ANDROID_HOME" "$SDK_PLATFORM" > /dev/null 2>&1

          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: Decode release keystore
        if: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
        run: |
          KEYSTORE_DIR="${{ github.workspace }}/config/signing"
          mkdir -p "$KEYSTORE_DIR"
          # 从 base64 解码（GitHub 会自动 mask secret 值）
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "$KEYSTORE_DIR/release.keystore"
          echo "✅ Keystore decoded to $KEYSTORE_DIR/release.keystore"

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build Release APK
        id: build-step
        continue-on-error: true
        run: |
          ./gradlew assembleRelease --stacktrace --no-daemon > build_output.txt 2>&1
          echo "exit_code=$?" >> $GITHUB_OUTPUT
        env:
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_STORE_FILE: ${{ github.workspace }}/config/signing/release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}

      - name: Show build output (last 100 lines)
        if: always()
        run: |
          if [ -f build_output.txt ]; then
            LINES=$(wc -l < build_output.txt)
            {
              echo "## Build Output (last 100 of $LINES lines)"
              echo '```'
              tail -100 build_output.txt
              echo '```'
            } >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-build-log
          path: build_output.txt
          if-no-files-found: ignore

      - name: Exit with build result
        if: steps.build-step.outputs.exit_code != '0'
        run: |
          echo "❌ Release build failed with exit code ${{ steps.build-step.outputs.exit_code }}"
          exit ${{ steps.build-step.outputs.exit_code }}

      - name: Get version from tag
        id: get-version
        if: steps.build-step.outputs.exit_code == '0'
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Generate release notes
        id: release-notes
        if: steps.build-step.outputs.exit_code == '0'
        run: |
          {
            echo "## SwipeGuard ${{ steps.get-version.outputs.version }}"
            echo ""
            echo "### 变更"
            echo "- 自动生成：请编辑此 Release 的描述"
            echo ""
            echo "### 安装"
            echo "1. 下载 APK"
            echo "2. 在 LSPosed 中激活模块"
            echo "3. 重启 system_server"
          } > release_notes.md

      - name: Create Release
        if: steps.build-step.outputs.exit_code == '0'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get-version.outputs.tag }}
          name: SwipeGuard ${{ steps.get-version.outputs.version }}
          body_path: release_notes.md
          draft: true  # 标记为草稿，人工复核后再发布
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/output-metadata.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
